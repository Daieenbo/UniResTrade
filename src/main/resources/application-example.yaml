# ============================================================
# 配置模板 —— 复制为 application.yaml 后按自己的环境修改
#   cp src/main/resources/application-example.yaml src/main/resources/application.yaml
# 注意：application.yaml 已在 .gitignore 中排除，不要提交真实密码
# ============================================================

server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 也可以整段用环境变量覆盖：DB_URL / DB_USERNAME / DB_PASSWORD
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:idle_resource}?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:请填写你的数据库密码}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 生产环境建议改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      update-strategy: IGNORED

# 原项目用 ${ip} 占位符引用数据库主机，这里保留同名变量以兼容代码
ip: ${DB_HOST:127.0.0.1}
